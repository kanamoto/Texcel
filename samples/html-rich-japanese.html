<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>日本語の在庫表</title>
  <style>
    .inventory { border-collapse: collapse; background: #fff4cc; }
  </style>
</head>
<body>
<table class="inventory">
  <tr><th>品目</th><th>説明</th><th>状態</th></tr>
  <tr>
    <td>茶碗</td>
    <td><strong>手仕事</strong>の模様</td>
    <td><a href="https://example.invalid/item">詳細を見る</a></td>
  </tr>
  <tr>
    <td>湯のみ</td>
    <td><em>軽くて丈夫</em></td>
    <td>在庫あり</td>
  </tr>
</table>
</body>
</html>
